# =============================================================================
# Blogger Proxy 配置文件
# =============================================================================
# 此文件为 YAML 格式，修改后需要重启服务才能生效。
# 所有配置项均包含在 server 节点下。
# =============================================================================

server:
  # ---- 服务器监听地址 ----
  # 格式：<IP>:<端口>，如 ":8080" 监听所有网卡的 8080 端口
  #        "127.0.0.1:8080" 仅监听本机回环地址
  listen: ":8080"

  # ---- 缓存目录 ----
  # 静态资源下载后存储在此目录，支持相对路径（相对于程序运行目录）
  # 程序启动时会自动创建该目录
  cache_dir: "./static_cache"

  # ---- 缓存有效期 ----
  # 超过此时间的缓存文件会被自动清理
  # 格式：Go duration 字符串
  #   1m    = 1 分钟
  #   168h  = 7 天
  #   720h  = 30 天
  cache_ttl: "1m"

  # ---- 缓存容量上限 ----
  # 超出此限制时，按文件修改时间从旧到新淘汰
  # 支持格式：1GB、500MB、100KB、1TB（不区分大小写）
  max_cache_size: "1GB"

  # ---- 代理域名白名单 ----
  # 只有此列表中的域名才会被代理转发
  # 将你的 Blogger 博客自定义域名填在这里
  proxy_domains:
    - "www.your-blog-domain.com"

  # ---- 同站域名别名 ----
  # 与当前请求域名视为同一站点的额外域名列表。
  # 指向这些域名的 <a href> 导航链接也会被重写为相对路径。
  # 如果博客可以通过多个域名访问（例如 www.example.com 和 example.com），
  # 可在此配置，避免这些域名之间的跳转。
  # 默认空列表，仅对当前请求域名生效。
  same_site_domains: []

  # ---- 上游目标地址 ----
  # Blogger 博客在 Google 的托管地址
  # 通常情况下无需修改此值
  target_address: "http://ghs.google.com"

  # ---- 需要缓存加速的静态资源域名 ----
  # HTML 页面中指向这些域名的资源链接（CSS/JS/图片/字体等）
  # 会被替换为 /static-cache/?url=... 的本地代理路径
  # 同时支持精确域名匹配和子域名匹配
  # 如果你的博客引用了其他外部资源域名，也可以添加进来
  cache_domains:
    # Blogger 图片托管
    - "bp.blogspot.com"
    # Blogger 主题资源（JS/CSS）
    - "resources.blogblog.com"
    # Blogger 自身资源
    - "www.blogger.com"
    # Google 字体 CSS 文件
    - "fonts.googleapis.com"
    # Google 字体文件（woff2/ttf 等）
    - "fonts.gstatic.com"
    # Google 用户内容（头像、上传的图片等）
    - "lh3.googleusercontent.com"